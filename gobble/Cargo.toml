[package]
name = "gobble"
version = "0.1.0"
edition = "2021"

[dependencies]
gobble-lib = { path = "../gobble-lib" }

# Agave local crates
solana-program-runtime = { path = "../agave/program-runtime" }
solana-transaction-context = { path = "../agave/transaction-context" }
solana-svm-callback = { path = "../agave/svm-callback" }
solana-svm-feature-set = { path = "../agave/svm-feature-set" }
solana-svm-log-collector = { path = "../agave/svm-log-collector" }
solana-svm-timings = { path = "../agave/svm-timings" }
solana-svm-transaction = { path = "../agave/svm-transaction" }
solana-compute-budget = { path = "../agave/compute-budget", features = ["agave-unstable-api"] }
solana-builtins = { path = "../agave/builtins", features = ["agave-unstable-api"] }
agave-syscalls = { path = "../agave/syscalls" }

# Published Solana crates
solana-account = "3.4"
solana-pubkey = "4"
solana-instruction = "3.1"
solana-instructions-sysvar = "3.0.0"
solana-message = "3.1"
solana-hash = "4.1"
solana-rent = { version = "3", features = ["sysvar"] }
solana-sdk-ids = "3.1"
solana-transaction = "3.1"

# CLI + networking
clap = { version = "4", features = ["derive"] }
bs58 = "0.5"
bincode = "1.3"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
base64 = "0.22"

[patch.crates-io]
solana-sbpf = { path = "../sbpf" }
crossbeam-epoch = { git = "https://github.com/anza-xyz/crossbeam", rev = "fd279d707025f0e60951e429bf778b4813d1b6bf" }
